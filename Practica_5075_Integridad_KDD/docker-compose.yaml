services:
  # ==========================================
  # HDFS: NameNode & DataNode
  # ==========================================
  namenode:
    image: apache/hadoop:3.4.0
    container_name: namenode
    hostname: namenode
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo '<configuration><property><name>fs.defaultFS</name><value>hdfs://namenode:9000</value></property></configuration>' > /opt/hadoop/etc/hadoop/core-site.xml
        if [ ! -d /tmp/hadoop-root/dfs/name/current ]; then
          /opt/hadoop/bin/hdfs namenode -format -force -nonInteractive
        fi
        /opt/hadoop/bin/hdfs namenode
    ports:
      - "9871:9870"   # Mapeado a 9871 en host para acceder a la Web UI
      - "9000:9000"
    volumes:
      - namenode_data:/tmp/hadoop-root/dfs/name
    networks:
      - bigdata-net

  datanode:
    image: apache/hadoop:3.4.0
    container_name: datanode
    hostname: datanode
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo '<configuration><property><name>fs.defaultFS</name><value>hdfs://namenode:9000</value></property></configuration>' > /opt/hadoop/etc/hadoop/core-site.xml
        until (echo > /dev/tcp/namenode/9000) 2>/dev/null; do
          echo "Esperando a NameNode en el puerto 9000..."
          sleep 2
        done
        /opt/hadoop/bin/hdfs datanode
    depends_on:
      - namenode
    volumes:
      - datanode_data:/tmp/hadoop-root/dfs/data
    networks:
      - bigdata-net

  # ==========================================
  # YARN: ResourceManager & NodeManager
  # ==========================================
  resourcemanager:
    image: apache/hadoop:3.4.0
    container_name: resourcemanager
    hostname: resourcemanager
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo '<configuration><property><name>yarn.resourcemanager.hostname</name><value>resourcemanager</value></property></configuration>' > /opt/hadoop/etc/hadoop/yarn-site.xml
        /opt/hadoop/bin/yarn resourcemanager
    ports:
      - "8088:8088"
    networks:
      - bigdata-net

  nodemanager:
    image: apache/hadoop:3.4.0
    container_name: nodemanager
    hostname: nodemanager
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo '<configuration><property><name>yarn.resourcemanager.hostname</name><value>resourcemanager</value></property></configuration>' > /opt/hadoop/etc/hadoop/yarn-site.xml
        /opt/hadoop/bin/yarn nodemanager
    depends_on:
      - resourcemanager
    ports:
      - "8042:8042"
    networks:
      - bigdata-net

  # ==========================================
  # SPARK: Master & Worker
  # ==========================================
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    hostname: spark-master
    user: root
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - bigdata-net

  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    user: root
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    ports:
      - "8081:8081"
    networks:
      - bigdata-net

  # ==========================================
  # KAFKA (Apache Kafka 3.8.0 con KRaft)
  # ==========================================
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    hostname: kafka
    user: root
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - bigdata-net

  # ==========================================
  # BASES DE DATOS Y JUPYTER
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    volumes:
      - mongo_data:/data/db
    networks:
      - bigdata-net

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bigdata_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bigdata-net

  mysql:
    image: mysql:8.0
    container_name: mysql
    hostname: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bigdata_db
      MYSQL_USER: bigdata_user
      MYSQL_PASSWORD: userpassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bigdata-net

  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: jupyter_notebook
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
    volumes:
      - ./notebooks:/home/jovyan/work
    networks:
      - bigdata-net

  hadoop:
    image: apache/hadoop:3.4.0
    container_name: hadoop-lab
    hostname: hadoop-lab
    user: root
    ports:
      - "9872:9870"   # Cambiado de 9870 a 9872 (evita puerto ocupado en el host)
      - "8089:8088"   # Cambiado de 8088 a 8089 (evita conflicto con resourcemanager)
    #command: ["standalone"]
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - ./datos:/workspace

networks:
  bigdata-net:
    driver: bridge

volumes:
  namenode_data:
  datanode_data:
  kafka_data:
  mongo_data:
  postgres_data:
  nodemanager_data:
  resourcemanager_data:
  mysql_data:
  hadoop_data: